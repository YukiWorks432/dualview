name: Format ProRes changes

on:
  push:
    branches:
      - feat/prores-playback

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/prores-playback

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format changed files
        run: |
          pnpm exec oxfmt \
            src/components/comparison/SideBySide.tsx \
            src/components/comparison/TemporalDiffGraph.tsx \
            src/components/comparison/WebGLComparison.tsx \
            src/components/media/VideoSurface.tsx \
            src/hooks/useProResClipSync.ts \
            src/lib/media/frameSource.ts \
            src/lib/webgl/metricsComputation.ts

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format ProRes changes"
          git push origin HEAD:feat/prores-playback

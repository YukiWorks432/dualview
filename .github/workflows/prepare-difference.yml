name: Prepare difference feature branch
on:
  push:
    branches:
      - feat/timeline-difference-intervals
permissions:
  contents: write
concurrency:
  group: prepare-timeline-difference
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'YukiWorks432/dualview' && github.ref == 'refs/heads/feat/timeline-difference-intervals'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply verified integration points
        run: node scripts/prepare-difference-branch.mjs
      - name: Resolve added dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Format feature files and publish to this branch only
        shell: bash
        run: |
          pnpm exec oxfmt src/lib/difference src/stores/differenceStore.ts src/stores/differenceStore.test.ts src/workers/difference.worker.ts src/hooks/useDifferenceLifecycle.ts src/components/timeline/DifferenceControls.tsx src/components/timeline/DifferencePlot.tsx src/components/comparison/TemporalDiffGraph.tsx src/App.tsx src/components/timeline/Timeline.tsx tests/browser/difference.e2e.ts playwright.config.ts scripts/create-difference-fixtures.mjs scripts/prepare-difference-branch.mjs docs/timeline-differences.md package.json vite.config.ts public/licenses/additional-notices.md README.md .github/workflows/ci.yml .github/workflows/prepare-difference.yml
          git add src/lib/difference src/stores/differenceStore.ts src/stores/differenceStore.test.ts src/workers/difference.worker.ts src/hooks/useDifferenceLifecycle.ts src/components/timeline/DifferenceControls.tsx src/components/timeline/DifferencePlot.tsx src/components/comparison/TemporalDiffGraph.tsx src/App.tsx src/components/timeline/Timeline.tsx tests/browser/difference.e2e.ts playwright.config.ts scripts/create-difference-fixtures.mjs scripts/prepare-difference-branch.mjs docs/timeline-differences.md package.json pnpm-lock.yaml vite.config.ts public/licenses/additional-notices.md README.md .gitignore .github/workflows/ci.yml .github/workflows/prepare-difference.yml
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: integrate and format timeline difference analysis'
            git push origin HEAD:refs/heads/feat/timeline-difference-intervals
          fi
          echo "VALIDATED_HEAD=$(git rev-parse HEAD)"
      - name: Run project checks
        run: pnpm check
      - name: Set up browser validation
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pnpm exec playwright install --with-deps chromium
      - name: Run actual video tests
        run: pnpm test:browser

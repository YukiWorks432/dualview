name: Prepare difference feature branch
on:
  push:
    branches:
      - feat/timeline-difference-intervals
permissions:
  contents: write
concurrency:
  group: prepare-timeline-difference
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'YukiWorks432/dualview' && github.ref == 'refs/heads/feat/timeline-difference-intervals'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Apply source corrections
        run: node scripts/prepare-difference-branch.mjs
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format and publish source changes only
        shell: bash
        run: |
          pnpm exec oxfmt src/lib/difference src/stores/differenceStore.test.ts src/components/timeline/DifferenceControls.tsx tests/browser/difference.e2e.ts scripts/prepare-difference-branch.mjs vite.config.ts .github/workflows/prepare-difference.yml
          git add src/lib/difference src/stores/differenceStore.test.ts src/components/timeline/DifferenceControls.tsx tests/browser/difference.e2e.ts scripts/prepare-difference-branch.mjs vite.config.ts
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: validate comparison timing and keep initial analysis stable'
            git push origin HEAD:refs/heads/feat/timeline-difference-intervals
          fi
          echo "VALIDATED_SOURCE_HEAD=$(git rev-parse HEAD)"
      - name: Run project checks
        run: pnpm check
      - name: Set up browser validation
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          pnpm exec playwright install --with-deps chromium
      - name: Run actual video tests
        run: pnpm test:browser
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: difference-browser-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

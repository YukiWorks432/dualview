name: UI refactor bootstrap

on:
  push:
    branches:
      - refactor/ui-foundation

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install and refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Format migration
        run: pnpm format

      - name: Commit generated metadata and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: finalize UI foundation dependencies"
            git push origin HEAD:refactor/ui-foundation
          fi

      - name: Validate
        run: pnpm check

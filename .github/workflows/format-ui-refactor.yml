name: Format UI refactor

on:
  push:
    branches:
      - refactor/ui-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt src/components/ui/KeyboardShortcutsHelp.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ui/KeyboardShortcutsHelp.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format shortcut help"
            git push origin HEAD:refactor/ui-foundation
          fi

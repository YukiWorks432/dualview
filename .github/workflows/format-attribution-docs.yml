name: Format attribution docs

on:
  push:
    branches:
      - docs/fork-attribution

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt README.md index.html package.json
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html package.json
          if ! git diff --cached --quiet; then
            git commit -m "style: format attribution docs"
            git push origin HEAD:docs/fork-attribution
          fi
